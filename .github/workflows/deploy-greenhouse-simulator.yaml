name: Build and Deploy Greenhouse Simulator

on:
  push:
    branches:
      - main
    paths:
      - "manifests/emqx-iot/simulator/runtime/**"
      - "manifests/emqx-iot/simulator/simulator.yaml"
      - ".github/workflows/deploy-greenhouse-simulator.yaml"

concurrency:
  group: deploy-manifests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zazanicholas01/greenhouse-iot-simulator

jobs:
  build-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_REF: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            -f manifests/emqx-iot/simulator/runtime/Dockerfile \
            -t "$IMAGE_REF" \
            -t "ghcr.io/${{ env.IMAGE_NAME }}:latest" \
            manifests/emqx-iot/simulator/runtime

          docker push "$IMAGE_REF"
          docker push "ghcr.io/${{ env.IMAGE_NAME }}:latest"

      - name: Update manifest image tag
        env:
          IMAGE_REF: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          perl -0pi -e 's|image:\s*.*greenhouse-iot-simulator:.*|image: '"$IMAGE_REF"'|g' manifests/emqx-iot/simulator/simulator.yaml

      - name: Commit manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/emqx-iot/simulator/simulator.yaml
          git diff --cached --quiet && exit 0

          git commit -m "Deploy greenhouse simulator ${GITHUB_SHA}"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done

          echo "Failed to push after retries"
          exit 1


