name: Build and Deploy Greenhouse UI

on:
  push:
    branches:
      - main
    paths:
      - "manifests/emqx-iot/simulator/ui/**"
      - ".github/workflows/deploy-greenhouse-ui.yaml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zazanicholas01/greenhouse-iot-ui

jobs:
  build-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            -f manifests/emqx-iot/simulator/ui/Dockerfile \
            -t "$IMAGE_REF" \
            -t "ghcr.io/zazanicholas01/${{ env.IMAGE_NAME }}:main" \
            manifests/emqx-iot/simulator/ui
          
          docker push "$IMAGE_REF"
          docker push "ghcr.io/zazanicholas01/${{ env.IMAGE_NAME }}:main"
      
      - name: Update manifest image tag
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          perl -0pi -e 's|image:\\s*.*greenhouse-iot-ui:.*|image: '"$IMAGE_REF"'|g' manifests/emqx-iot/simulator/ui-client.yaml

      - name: Commit manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/emqx-iot/simulator/ui-client.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy greenhouse UI ${GITHUB_SHA}"
          git push


