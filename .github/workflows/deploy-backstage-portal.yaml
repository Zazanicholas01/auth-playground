name: Build and Deploy Backstage Portal

on:
  push:
    branches:
      - main
    paths:
      - "backstage-portal/**"
      - "catalog-info.yaml"
      - ".github/workflows/deploy-backstage-portal.yaml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/zazanicholas01/backstage-portal

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=run-${{ github.run_number }}
            type=sha,format=long,prefix=sha-

      - name: Build and push image tags
        uses: docker/build-push-action@v6
        with:
          context: backstage-portal
          file: backstage-portal/packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}