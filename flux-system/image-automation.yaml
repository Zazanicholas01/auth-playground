---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: playground-manifests
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: playground-manifests
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        Update greenhouse images

        Automated update from Flux image automation.
    push:
      branch: main
  update:
    path: ./manifests/emqx-iot
    strategy: Setters
