apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: greenhouse-iot-ui
  namespace: flux-system
spec:
  image: ghcr.io/zazanicholas01/greenhouse-iot-ui
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: greenhouse-iot-ui
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: greenhouse-iot-ui
  filterTags:
    pattern: '^run-(?P<num>[0-9]+)$'
    extract: '$num'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
