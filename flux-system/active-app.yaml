apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: active-app
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 1m
  path: ./manifests/emqx-iot
  prune: true
  sourceRef:
    kind: GitRepository
    name: playground-manifests
  timeout: 5m
  wait: true