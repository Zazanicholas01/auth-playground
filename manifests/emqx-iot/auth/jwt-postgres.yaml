apiVersion: v1
kind: Secret
metadata:
  name: iot-auth-db-secret
type: Opaque
stringData:
  username: auth_user
  password: change-me-auth-password
  database: authdb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iot-auth-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iot-auth-postgres
spec:
  serviceName: iot-auth-postgres
  replicas: 1
  selector:
    matchLabels:
      app: iot-auth-postgres
  template:
    metadata:
      labels:
        app: iot-auth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iot-auth-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-auth-db-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: iot-auth-db-secret
                  key: database
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: iot-auth-postgres-data
        - name: postgres-init-sql
          configMap:
            name: iot-auth-postgres-init-sql
  volumeClaimTemplates: []
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
apiVersion: v1
kind: Service
metadata:
  name: iot-auth-postgres
spec:
  selector:
    app: iot-auth-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-auth-postgres-init-sql
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS users (
      id BIGSERIAL PRIMARY KEY,
      username TEXT NOT NULL UNIQUE,
      email TEXT NOT NULL UNIQUE,
      password_hash TEXT NOT NULL,
      role TEXT NOT NULL DEFAULT 'guest',
      is_active BOOLEAN NOT NULL DEFAULT TRUE,
      created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS refresh_tokens (
      id BIGSERIAL PRIMARY KEY,
      user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      token_hash TEXT NOT NULL UNIQUE,
      expires_at TIMESTAMP NOT NULL,
      revoked_at TIMESTAMP NULL,
      created_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS refresh_tokens_user_by_idx
      ON refresh_tokens(user_id);

    INSERT INTO users (username, email, password_hash, role)
    VALUES
      ('guest-demo', 'guest@iot.local', crypt('guest123!', gen_salt('bf', 12)), 'guest'),
      ('tech-demo', 'technician@iot.local', crypt('tech123!', gen_salt('bf', 12)), 'technician'),
      ('admin-demo', 'admin@iot.local', crypt('admin123!', gen_salt('bf', 12)), 'admin')
    ON CONFLICT (username) DO NOTHING;
