apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot-playground

resources:
  - namespace.yaml
  - emqx/emqx.yaml
  - emqx/emqx-route.yaml
#  - emqx/mqtt-tcp-route.yaml
  - simulator/api.yaml
  - simulator/simulator.yaml
  - simulator/ui-client.yaml
  - simulator/simulator-route.yaml
  - config.yaml
  - simulator/timescaledb.yaml
  - simulator/dbgate.yaml
  - simulator/bronze-silver-cron.yaml
  - monitoring/victoriametrics-scrape-config.yaml
  - monitoring/victoriametrics.yaml
  - monitoring/grafana-datasources.yaml
  - monitoring/grafana.yaml
  - monitoring/grafana-dashboard-provider.yaml
  - monitoring/grafana-dashboards.yaml

configMapGenerator:
  - name: iot-sql-scripts
    files:
      - simulator/api/app/sql/promote-bronze-to-silver.sql

  - name: iot-timescaledb-init
    files:
      - simulator/api/app/sql/01-init.sql
      - simulator/api/app/sql/03-gold-layer.sql
      - simulator/api/app/sql/04-gold-continuous-aggregates.sql
