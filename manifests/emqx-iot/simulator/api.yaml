apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-api
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-api
  template:
    metadata:
      labels:
        app: iot-api
    spec:
      containers:
        - name: api
          image: ghcr.io/zazanicholas01/greenhouse-iot-api:run-24 # {"$imagepolicy": "flux-system:greenhouse-iot-api"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_PORT
              value: "8080"
            - name: MQTT_URL
              value: mqtt://emqx-listeners:1883
            - name: MQTT_TOPIC_ROOT
              value: site/alpha/devices
            - name: EVENT_HISTORY_SIZE
              value: "250"
            - name: HISTORY_POINTS
              value: "300"
            - name: DB_BOOTSTRAP_SQL_DIR
              value: /app/sql
            - name: DB_HOST
              value: iot-timescaledb
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: password
            - name: ENABLE_METRICS
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iot-jwt-auth-secret
                  key: jwt-secret
            - name: JWT_ISSUER
              value: "iot.local"
            - name: JWT_AUDIENCE
              value: "iot-ui"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: db-init-sql
              mountPath: /app/sql
      volumes:
        - name: db-init-sql
          configMap:
            name: iot-timescaledb-init
---
apiVersion: v1
kind: Service
metadata:
  name: iot-api
  namespace: iot-playground
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: iot-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
