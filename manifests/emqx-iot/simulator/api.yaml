apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-api
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-api
  template:
    metadata:
      labels:
        app: iot-api
    spec:
      containers:
        - name: api
          image: ghcr.io/zazanicholas01/greenhouse-iot-api:run-5 # {"$imagepolicy": "flux-system:greenhouse-iot-api"}
          imagePullPolicy: Always
          command: ["bun", "run", "index.js"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_PORT
              value: "8080"
            - name: MQTT_URL
              value: mqtt://emqx-listeners:1883
            - name: MQTT_TOPIC_ROOT
              value: site/alpha/devices
            - name: EVENT_HISTORY_SIZE
              value: "250"
            - name: DB_HOST
              value: iot-timescaledb
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: api-code
              mountPath: /app/index.js
              subPath: index.js
            - name: db-init-sql
              mountPath: /app/db-init
      volumes:
        - name: api-code
          configMap:
            name: iot-api-code
        - name: db-init-sql
          configMap:
            name: iot-timescaledb-init
---
apiVersion: v1
kind: Service
metadata:
  name: iot-api
  namespace: iot-playground
spec:
  selector:
    app: iot-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
