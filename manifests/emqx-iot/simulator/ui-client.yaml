apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-ui-code
  namespace: iot-playground
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Greenhouse Digital Twin</title>
        <link rel="stylesheet" href="/styles.css" />
      </head>
      <body>
        <main>
          <aside class="panel left">
            <div class="section-head">
              <div>
                <div class="eyebrow">&#127807; Zones</div>
                <h3 class="section-title">Greenhouse Fleet</h3>
              </div>
              <div id="broker" class="pill normal">Broker unknown</div>
            </div>
            <div id="fleet" class="event-list"></div>
          </aside>

          <section class="center">
            <section class="panel hero">
              <div>
                <div class="eyebrow">&#127793; Near-digital-twin greenhouse</div>
                <h1>Greenhouse Operations Console</h1>
                <p class="muted hero-copy">
                  Synthetic climate, irrigation, root-zone, and actuator telemetry flowing through EMQX.
                </p>
              </div>
              <div class="hero-meta">
                <div class="metric-chip">
                  <span class="muted">Scenario</span>
                  <strong id="scenario-label">unknown</strong>
                </div>
                <div class="metric-chip">
                  <span class="muted">Zone</span>
                  <strong id="zone-label">--</strong>
                </div>
              </div>
            </section>

            <section class="panel controls">
              <button data-scenario="baseline-day">Baseline Day</button>
              <button data-scenario="hot-humid-afternoon">Hot Humid Afternoon</button>
              <button data-scenario="cold-night">Cold Night</button>
              <button data-scenario="irrigation-failure">Irrigation Failure</button>
              <button data-scenario="ventilation-failure">Ventilation Failure</button>
              <button data-scenario="high-radiation-stress">High Radiation Stress</button>
            </section>

            <section id="summary" class="stats sticky-summary"></section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#127777;&#65039; Air Climate</div>
                    <h3 class="section-title">Indoor Conditions</h3>
                  </div>
                </div>
                <div id="indoor-card" class="kv-grid"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#9728;&#65039; Weather Driver</div>
                    <h3 class="section-title">Outdoor Conditions</h3>
                  </div>
                </div>
                <div id="outdoor-card" class="kv-grid"></div>
              </article>
            </section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#129716; Root Zone</div>
                    <h3 class="section-title">Soil and Irrigation</h3>
                  </div>
                </div>
                <div id="soil-card" class="kv-grid"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#9881;&#65039; Automation</div>
                    <h3 class="section-title">Actuator State</h3>
                  </div>
                </div>
                <div id="actuator-card" class="kv-grid"></div>
              </article>
            </section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#127811; Derived Metrics</div>
                    <h3 class="section-title">Agronomic Signals</h3>
                  </div>
                </div>
                <div id="derived-card" class="kv-grid"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#128200; Trend Snapshot</div>
                    <h3 class="section-title">Recent History</h3>
                  </div>
                </div>
                <div id="history-spark" class="spark-grid"></div>
              </article>
            </section>
          </section>

          <aside class="panel right">
            <div class="section-head">
              <div>
                <div class="eyebrow">&#128680; Alerts</div>
                <h3 class="section-title">Event Stream</h3>
              </div>
            </div>
            <div id="events" class="event-list"></div>
          </aside>
        </main>

        <script>
          window.__IOT_CONFIG__ = {
            apiBase: window.location.origin + "/api",
            simulatorBase: window.location.origin + "/simulator"
          };
        </script>
        <script src="/index.js" type="module"></script>
      </body>
    </html>


  styles.css: |
    :root {
      --bg: #eef6e8;
      --bg-2: #d7eccf;
      --panel: rgba(246, 252, 242, 0.95);
      --panel-2: rgba(234, 247, 228, 0.96);
      --line: rgba(56, 122, 64, 0.14);
      --glass: rgba(255, 255, 255, 0.28);
      --text: #16301a;
      --muted: #54705a;
      --green: #1f8f3a;
      --green-2: #4f9a3d;
      --leaf: #77b255;
      --amber: #b37a14;
      --red: #b23b3b;
      --blue: #2d6f7c;
      --sky: #8dcfdf;
      --shadow: 0 22px 40px rgba(24, 66, 28, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(31, 143, 58, 0.24), transparent 30%),
        radial-gradient(circle at bottom right, rgba(79, 154, 61, 0.18), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.42;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, rgba(141, 207, 223, 0.16), transparent 18%),
        radial-gradient(circle at 78% 22%, rgba(119, 178, 85, 0.16), transparent 20%),
        radial-gradient(circle at 50% 100%, rgba(31, 143, 58, 0.10), transparent 28%);
      opacity: 0.9;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 18px;
      padding: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(95, 114, 99, 0.15);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--glass), transparent 35%);
      pointer-events: none;
      opacity: 0.35;
    }

    .left,
    .right {
      padding: 18px;
      position: sticky;
      top: 20px;
      align-self: start;
    }

    .center {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      background:
        linear-gradient(135deg, rgba(31, 143, 58, 0.16), rgba(79, 154, 61, 0.14)),
        var(--panel);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(141, 207, 223, 0.22), transparent 62%);
      border-radius: 999px;
      pointer-events: none;
    }

    .hero h1 {
      margin: 4px 0 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    .hero-copy {
      max-width: 580px;
      margin: 10px 0 0;
    }

    .hero-meta {
      display: grid;
      gap: 10px;
      min-width: 180px;
    }

    .metric-chip {
      display: grid;
      gap: 4px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(244, 248, 239, 0.92);
      border: 1px solid rgba(95, 114, 99, 0.12);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 18px;
    }

    .controls button {
      border: 1px solid rgba(31, 143, 58, 0.28);
      background: rgba(244, 248, 239, 0.95);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      transition: 120ms ease;
    }

    .controls button:hover {
      border-color: rgba(31, 143, 58, 0.58);
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(31, 143, 58, 0.12);
    }

    .sticky-summary {
      position: sticky;
      top: 20px;
      z-index: 2;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      padding: 16px;
      border-radius: 16px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .block {
      padding: 18px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .left .section-head,
    .right .section-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding-bottom: 10px;
      background: linear-gradient(180deg, rgba(246, 252, 242, 0.98), rgba(246, 252, 242, 0.86), transparent);
    }

    .section-title {
      margin: 2px 0 0;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .normal {
      background: rgba(31, 143, 58, 0.18);
      color: var(--green);
    }

    .warning {
      background: rgba(179, 122, 20, 0.14);
      color: var(--amber);
    }

    .critical {
      background: rgba(178, 59, 59, 0.14);
      color: var(--red);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
    }

    .kv-item {
      padding: 12px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.08);
    }

    .kv-item .k {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .kv-item .v {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 700;
    }

    .event-list {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 140px);
      overflow: auto;
    }

    .event {
      padding: 12px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.10);
    }

    .event.alert-warning {
      border-color: rgba(179, 122, 20, 0.30);
      background: linear-gradient(135deg, rgba(255, 245, 225, 0.95), rgba(234, 247, 228, 0.96));
    }

    .event.alert-critical {
      border-color: rgba(178, 59, 59, 0.34);
      background: linear-gradient(135deg, rgba(255, 234, 234, 0.96), rgba(246, 236, 232, 0.96));
      box-shadow: 0 8px 18px rgba(178, 59, 59, 0.10);
    }

    .event.alert-normal {
      border-color: rgba(31, 143, 58, 0.22);
    }

    .spark-grid {
      display: grid;
      gap: 12px;
    }

    .spark-row {
      display: grid;
      gap: 6px;
    }

    .spark-bars {
      display: flex;
      align-items: end;
      gap: 4px;
      height: 64px;
    }

    .spark-bars span {
      flex: 1;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, rgba(79, 154, 61, 0.85), rgba(31, 143, 58, 0.65));
      min-height: 4px;
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
      }

      .left,
      .right,
      .sticky-summary {
        position: static;
      }

      .stats,
      .grid-two {
        grid-template-columns: 1fr;
      }
    }

  index.js: |


    const config = window.__IOT_CONFIG__ || {};
    const apiBase = config.apiBase || (window.location.origin + "/api");
    const simulatorBase = config.simulatorBase || (window.location.origin + "/simulator");

    const fleetEl = document.getElementById("fleet");
    const summaryEl = document.getElementById("summary");
    const eventsEl = document.getElementById("events");
    const brokerEl = document.getElementById("broker");
    const scenarioLabelEl = document.getElementById("scenario-label");
    const zoneLabelEl = document.getElementById("zone-label");
    const indoorCardEl = document.getElementById("indoor-card");
    const outdoorCardEl = document.getElementById("outdoor-card");
    const soilCardEl = document.getElementById("soil-card");
    const actuatorCardEl = document.getElementById("actuator-card");
    const derivedCardEl = document.getElementById("derived-card");
    const historySparkEl = document.getElementById("history-spark");

    let currentZoneId = null;

    function severityClass(severity) {
      if (severity === "critical") return "critical";
      if (severity === "warning") return "warning";
      return "normal";
    }

    function severityIcon(severity) {
      if (severity === "critical") return "&#128293;";
      if (severity === "warning") return "&#9888;&#65039;";
      return "&#127807;";
    }

    function metricIcon(label) {
      const icons = {
        "Air Temp": "&#127777;&#65039;",
        "Humidity": "&#128167;",
        "CO2": "&#127788;&#65039;",
        "Pressure": "&#127756;",
        "PAR": "&#9728;&#65039;",
        "Abs Humidity": "&#128166;",
        "Outdoor Temp": "&#9728;&#65039;",
        "Outdoor RH": "&#9729;&#65039;",
        "Solar": "&#127774;",
        "Wind": "&#127788;&#65039;",
        "Soil Moisture": "&#129716;",
        "Soil Temp": "&#127793;",
        "EC": "&#129514;",
        "pH": "&#129514;",
        "Tank Level": "&#128703;",
        "Irrig. Flow": "&#128167;",
        "Vent": "&#127811;",
        "Heater": "&#128293;",
        "Fan": "&#127744;",
        "Mister": "&#128166;",
        "Irrigation": "&#128167;",
        "Grow Light": "&#128161;",
        "Dew Point": "&#127783;&#65039;",
        "VPD": "&#127787;&#65039;",
        "ET Proxy": "&#127811;",
        "Irrigation Demand": "&#128166;",
      };
      return icons[label] || "&#127807;";
    }

    function fmt(value, digits = 1, suffix = "") {
      if (value === null || value === undefined || Number.isNaN(value)) return "--";
      return Number(value).toFixed(digits) + suffix;
    }

    function pickPrimaryZone(devices) {
      if (!devices.length) return null;
      const greenhouse = devices.find((d) => d.zoneId === "greenhouse-a" || d.deviceId === "greenhouse-a");
      return greenhouse || devices[0];
    }

    function renderSummary(summary) {
      const cards = [
        ["&#127807; Zones", summary.zones ?? 0, ""],
        ["&#9989; Online", summary.online ?? 0, ""],
        ["&#128293; Critical", summary.critical ?? 0, ""],
        ["&#127777;&#65039; Avg Temp", summary.avgTemperature, " C"],
        ["&#127787;&#65039; Avg VPD", summary.avgVpd, " kPa"],
      ];

      summaryEl.innerHTML = cards.map(([label, value, suffix]) =>
        '<div class="stat">' +
          '<div class="muted">' + label + '</div>' +
          '<div class="value">' + (typeof value === "number" ? value.toFixed(1).replace(".0", "") + suffix : value) + '</div>' +
        '</div>'
      ).join("");
    }

    function renderFleet(devices) {
      fleetEl.innerHTML = devices.map((device) =>
        '<div class="event">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center">' +
            '<strong>' + (device.zoneId || device.deviceId) + '</strong>' +
            '<span class="pill ' + severityClass(device.severity) + '">' + severityIcon(device.severity) + ' ' + (device.severity || "normal") + '</span>' +
          '</div>' +
          '<div class="muted" style="margin-top:6px">Scenario: ' + (device.scenario || "unknown") + '</div>' +
          '<div class="muted" style="margin-top:4px">Last seen: ' + new Date(device.lastSeen || Date.now()).toLocaleTimeString() + '</div>' +
          '<div style="margin-top:10px;font-size:14px">' +
            '&#127777;&#65039; ' + fmt(device.indoor?.temperature ?? device.temperature, 1, ' C') +
            ' Â· &#128167; ' + fmt(device.indoor?.humidity ?? device.humidity, 1, ' %') +
          '</div>' +
        '</div>'
      ).join("");
    }

    function renderKv(target, items) {
      target.innerHTML = items.map(([label, value]) =>
        '<div class="kv-item">' +
          '<div class="k">' + metricIcon(label) + ' ' + label + '</div>' +
          '<div class="v">' + value + '</div>' +
        '</div>'
      ).join("");
    }

    function renderZone(zone) {
      zoneLabelEl.textContent = zone.zoneId || zone.deviceId || "--";
      scenarioLabelEl.textContent = zone.scenario || "unknown";

      renderKv(indoorCardEl, [
        ["Air Temp", fmt(zone.indoor?.temperature, 1, " C")],
        ["Humidity", fmt(zone.indoor?.humidity, 1, " %")],
        ["CO2", fmt(zone.indoor?.co2, 0, " ppm")],
        ["Pressure", fmt(zone.indoor?.pressure, 1, " hPa")],
        ["PAR", fmt(zone.indoor?.par, 0, " umol")],
        ["Abs Humidity", fmt(zone.indoor?.absoluteHumidity, 2, " g/m3")],
      ]);

      renderKv(outdoorCardEl, [
        ["Outdoor Temp", fmt(zone.outdoor?.temperature, 1, " C")],
        ["Outdoor RH", fmt(zone.outdoor?.humidity, 1, " %")],
        ["Solar", fmt(zone.outdoor?.solar, 3, "")],
        ["Wind", fmt(zone.outdoor?.wind, 2, " m/s")],
      ]);

      renderKv(soilCardEl, [
        ["Soil Moisture", fmt(zone.soil?.moisture, 3, "")],
        ["Soil Temp", fmt(zone.soil?.temperature, 1, " C")],
        ["EC", fmt(zone.soil?.ec, 2, " mS/cm")],
        ["pH", fmt(zone.soil?.ph, 2, "")],
        ["Tank Level", fmt(zone.soil?.tankLevel, 1, " %")],
        ["Irrig. Flow", fmt(zone.soil?.irrigationFlow, 2, " L/min")],
      ]);

      renderKv(actuatorCardEl, [
        ["Vent", fmt(zone.actuators?.vent, 2, "")],
        ["Heater", fmt(zone.actuators?.heater, 2, "")],
        ["Fan", fmt(zone.actuators?.fan, 2, "")],
        ["Mister", fmt(zone.actuators?.mister, 2, "")],
        ["Irrigation", fmt(zone.actuators?.irrigation, 2, "")],
        ["Grow Light", fmt(zone.actuators?.growLight, 2, "")],
      ]);

      renderKv(derivedCardEl, [
        ["Dew Point", fmt(zone.derived?.dewPoint ?? zone.indoor?.dewPoint, 2, " C")],
        ["VPD", fmt(zone.derived?.vpd ?? zone.indoor?.vpd, 2, " kPa")],
        ["ET Proxy", fmt(zone.derived?.evapotranspiration, 2, "")],
        ["Irrigation Demand", fmt(zone.derived?.irrigationDemand, 1, " %")],
      ]);
    }

    function spark(values) {
      const valid = values.filter((v) => typeof v === "number" && Number.isFinite(v));
      if (!valid.length) return '<div class="muted">No history</div>';

      const min = Math.min(...valid);
      const max = Math.max(...valid);
      const range = Math.max(max - min, 0.0001);

      return values.map((value) => {
        if (typeof value !== "number" || !Number.isFinite(value)) {
          return '<span style="height:4px;opacity:0.25"></span>';
        }
        const h = 6 + ((value - min) / range) * 58;
        return '<span style="height:' + h.toFixed(0) + 'px"></span>';
      }).join("");
    }

    function renderHistory(points) {
      const latest = points.slice(-16);

      const rows = [
        ["&#127777;&#65039; Temperature", latest.map((p) => p.temperature)],
        ["&#128167; Humidity", latest.map((p) => p.humidity)],
        ["&#127788;&#65039; CO2", latest.map((p) => p.co2)],
        ["&#129716; Soil Moisture", latest.map((p) => p.soilMoisture)],
        ["&#128703; Tank Level", latest.map((p) => p.tankLevel)],
      ];

      historySparkEl.innerHTML = rows.map(([label, values]) =>
        '<div class="spark-row">' +
          '<div class="muted">' + label + '</div>' +
          '<div class="spark-bars">' + spark(values) + '</div>' +
        '</div>'
      ).join("");
    }

    function eventCardClass(payload) {
      return "event alert-" + severityClass(payload.severity);
    }

    function renderEvents(events) {
      eventsEl.innerHTML = events.slice(0, 30).map((event) => {
        const payload = event.payload || {};
        const label = payload.zoneId || payload.deviceId || "system";
        const msg = payload.message || payload.code || event.topic;

        return (
          '<div class="' + eventCardClass(payload) + '">' +
            '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center">' +
              '<strong>' + label + '</strong>' +
              '<span class="pill ' + severityClass(payload.severity) + '">' + severityIcon(payload.severity) + ' ' + event.type + '</span>' +
            '</div>' +
            '<div class="muted" style="margin-top:6px">' + new Date(event.receivedAt).toLocaleTimeString() + '</div>' +
            '<div style="margin-top:8px;font-size:14px;font-weight:600">' + msg + '</div>' +
          '</div>'
        );
      }).join("");
    }
    async function loadScenario() {
      const res = await fetch(simulatorBase + "/scenario");
      const data = await res.json();
      scenarioLabelEl.textContent = data.scenario || "unknown";
    }

    async function setScenario(name) {
      const res = await fetch(simulatorBase + "/scenario/" + name, {
        method: "POST",
      });

      if (!res.ok) {
        throw new Error("failed to change scenario");
      }

      await loadScenario();
      await load();
    }

    async function load() {
      try {
        const [health, devices, summary, alerts] = await Promise.all([
          fetch(apiBase + "/health").then((r) => r.json()),
          fetch(apiBase + "/devices").then((r) => r.json()),
          fetch(apiBase + "/summary").then((r) => r.json()),
          fetch(apiBase + "/alerts").then((r) => r.json()),
        ]);

        brokerEl.textContent = health.mqttConnected ? "Broker connected" : "Broker disconnected";
        brokerEl.className = "pill " + (health.mqttConnected ? "normal" : "critical");
        brokerEl.innerHTML = severityIcon(health.mqttConnected ? "normal" : "critical") + ' ' + brokerEl.textContent;

        renderSummary(summary);
        renderFleet(devices);
        renderEvents(alerts);

        const zone = pickPrimaryZone(devices);
        if (!zone) return;

        currentZoneId = zone.deviceId;
        renderZone(zone);

        const history = await fetch(apiBase + "/history/" + currentZoneId).then((r) => r.json());
        renderHistory(history);
      } catch (error) {
        console.error("failed to load dashboard", error);
      }
    }

    document.querySelectorAll("[data-scenario]").forEach((button) => {
      button.addEventListener("click", async () => {
        try {
          await setScenario(button.dataset.scenario);
        } catch (error) {
          console.error(error);
        }
      });
    });

    await loadScenario();
    await load();
    setInterval(load, 3000);

  server.js: |
    const port = Number(process.env.UI_PORT || 8080);

    Bun.serve({
      port,
      async fetch(request) {
        const url = new URL(request.url);
        const path = url.pathname === "/" ? "/index.html" : url.pathname;

        const file = Bun.file("/src" + path);

        if (!(await file.exists())) {
          return new Response("Not found", { status: 404 });
        }

        const headers = new Headers();

        if (path.endsWith(".html")) headers.set("content-type", "text/html; charset=utf-8");
        if (path.endsWith(".css")) headers.set("content-type", "text/css; charset=utf-8");
        if (path.endsWith(".js")) headers.set("content-type", "text/javascript; charset=utf-8");

        return new Response(file, { headers });
      },
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-ui
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-ui
  template:
    metadata:
      labels:
        app: iot-ui
    spec:
      containers:
        - name: ui
          image: oven/bun:1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - bun /src/server.js
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: UI_PORT
              value: "8080"
            - name: API_BASE
              value: http://iot-api:8080
          
          volumeMounts:
            - name: ui-code
              mountPath: /src
              readOnly: true
          
      volumes:
        - name: ui-code
          configMap:
            name: iot-ui-code
---
apiVersion: v1
kind: Service
metadata:
  name: iot-ui
  namespace: iot-playground
spec:
  selector:
    app: iot-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080









