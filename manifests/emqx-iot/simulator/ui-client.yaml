apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-ui-code
  namespace: iot-playground
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Greenhouse Digital Twin</title>
        <link rel="stylesheet" href="/styles.css" />
      </head>
      <body>
        <main>
          <aside class="panel left">
            <div class="section-head">
              <div>
                <div class="eyebrow">&#127807; Zones</div>
                <h3 class="section-title">Greenhouse Fleet</h3>
              </div>
              <div id="broker" class="pill normal">Broker unknown</div>
            </div>
            <div id="fleet" class="event-list"></div>
          </aside>

          <section class="center">
            <section class="panel hero">
              <div>
                <div class="eyebrow">&#127793; Near-digital-twin greenhouse</div>
                <h1>Greenhouse Operations Console</h1>
                <p class="muted hero-copy">
                  Synthetic climate, irrigation, root-zone, and actuator telemetry flowing through EMQX.
                </p>
              </div>
              <div class="hero-meta">
                <div class="metric-chip">
                  <span class="muted">Scenario</span>
                  <strong id="scenario-label">unknown</strong>
                </div>
                <div class="metric-chip">
                  <span class="muted">Zone</span>
                  <strong id="zone-label">--</strong>
                </div>
              </div>
            </section>

            <section class="panel controls">
              <button data-scenario="baseline-day">Baseline Day</button>
              <button data-scenario="hot-humid-afternoon">Hot Humid Afternoon</button>
              <button data-scenario="cold-night">Cold Night</button>
              <button data-scenario="irrigation-failure">Irrigation Failure</button>
              <button data-scenario="ventilation-failure">Ventilation Failure</button>
              <button data-scenario="high-radiation-stress">High Radiation Stress</button>
            </section>

            <section id="summary" class="stats sticky-summary"></section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#127777;&#65039; Air Climate</div>
                    <h3 class="section-title">Climate Trends</h3>
                  </div>
                  <div id="climate-meta" class="chart-meta"></div>
                </div>
                <div id="climate-chart" class="chart-shell"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#129716; Root Zone</div>
                    <h3 class="section-title">Watering and Root Zone</h3>
                  </div>
                  <div id="watering-meta" class="chart-meta"></div>
                </div>
                <div id="watering-chart" class="chart-shell"></div>
              </article>
            </section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#9728;&#65039; Weather Driver</div>
                    <h3 class="section-title">Current Outdoor Drivers</h3>
                  </div>
                </div>
                <div id="outdoor-card" class="mini-grid"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#9881;&#65039; Automation</div>
                    <h3 class="section-title">Actuator Snapshot</h3>
                  </div>
                </div>
                <div id="actuator-card" class="mini-grid"></div>
              </article>
            </section>

            <section class="grid-two">
              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#127811; Derived Metrics</div>
                    <h3 class="section-title">Derived Signals</h3>
                  </div>
                </div>
                <div id="derived-card" class="gauge-grid"></div>
              </article>

              <article class="panel block">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">&#128200; Trend Snapshot</div>
                    <h3 class="section-title">Recent History</h3>
                  </div>
                </div>
                <div id="history-spark" class="micro-grid"></div>
              </article>
            </section>
          </section>

          <aside class="panel right">
            <div class="section-head">
              <div>
                <div class="eyebrow">&#128680; Alerts</div>
                <h3 class="section-title">Event Stream</h3>
              </div>
            </div>
            <div id="events" class="event-list"></div>
          </aside>
        </main>

        <script>
          window.__IOT_CONFIG__ = {
            apiBase: window.location.origin + "/api",
            simulatorBase: window.location.origin + "/simulator"
          };
        </script>
        <script src="/index.js" type="module"></script>
      </body>
    </html>


  styles.css: |
    :root {
      --bg: #eef6e8;
      --bg-2: #d7eccf;
      --panel: rgba(246, 252, 242, 0.95);
      --panel-2: rgba(234, 247, 228, 0.96);
      --line: rgba(56, 122, 64, 0.14);
      --glass: rgba(255, 255, 255, 0.28);
      --text: #16301a;
      --muted: #54705a;
      --green: #1f8f3a;
      --green-2: #4f9a3d;
      --leaf: #77b255;
      --amber: #b37a14;
      --red: #b23b3b;
      --blue: #2d6f7c;
      --sky: #8dcfdf;
      --shadow: 0 22px 40px rgba(24, 66, 28, 0.12);
      --chart-grid: rgba(56, 122, 64, 0.14);
      --chart-track: rgba(31, 143, 58, 0.10);
      --climate-a: #1f8f3a;
      --climate-b: #2d6f7c;
      --climate-c: #b37a14;
      --water-a: #4f9a3d;
      --water-b: #2a9d8f;
      --water-c: #b23b3b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(31, 143, 58, 0.24), transparent 30%),
        radial-gradient(circle at bottom right, rgba(79, 154, 61, 0.18), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.42;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, rgba(141, 207, 223, 0.16), transparent 18%),
        radial-gradient(circle at 78% 22%, rgba(119, 178, 85, 0.16), transparent 20%),
        radial-gradient(circle at 50% 100%, rgba(31, 143, 58, 0.10), transparent 28%);
      opacity: 0.9;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 18px;
      padding: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(95, 114, 99, 0.15);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--glass), transparent 35%);
      pointer-events: none;
      opacity: 0.35;
    }

    .left,
    .right {
      padding: 18px;
      position: sticky;
      top: 20px;
      align-self: start;
    }

    .center {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      background:
        linear-gradient(135deg, rgba(31, 143, 58, 0.16), rgba(79, 154, 61, 0.14)),
        var(--panel);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(141, 207, 223, 0.22), transparent 62%);
      border-radius: 999px;
      pointer-events: none;
    }

    .hero h1 {
      margin: 4px 0 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }

    .hero-copy {
      max-width: 580px;
      margin: 10px 0 0;
    }

    .hero-meta {
      display: grid;
      gap: 10px;
      min-width: 180px;
    }

    .metric-chip {
      display: grid;
      gap: 4px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(244, 248, 239, 0.92);
      border: 1px solid rgba(95, 114, 99, 0.12);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 18px;
    }

    .controls button {
      border: 1px solid rgba(31, 143, 58, 0.28);
      background: rgba(244, 248, 239, 0.95);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      transition: 120ms ease;
    }

    .controls button:hover {
      border-color: rgba(31, 143, 58, 0.58);
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(31, 143, 58, 0.12);
    }

    .sticky-summary {
      position: sticky;
      top: 20px;
      z-index: 2;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      padding: 16px;
      border-radius: 16px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .block {
      padding: 18px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .left .section-head,
    .right .section-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding-bottom: 10px;
      background: linear-gradient(180deg, rgba(246, 252, 242, 0.98), rgba(246, 252, 242, 0.86), transparent);
    }

    .section-title {
      margin: 2px 0 0;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .normal {
      background: rgba(31, 143, 58, 0.18);
      color: var(--green);
    }

    .warning {
      background: rgba(179, 122, 20, 0.14);
      color: var(--amber);
    }

    .critical {
      background: rgba(178, 59, 59, 0.14);
      color: var(--red);
    }

    .chart-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .chart-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(244, 248, 239, 0.96);
      border: 1px solid rgba(95, 114, 99, 0.12);
      font-size: 12px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 auto;
    }

    .chart-shell {
      min-height: 260px;
    }

    .chart-card {
      display: grid;
      gap: 14px;
    }

    .chart-card svg,
    .micro-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .chart-frame {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.14));
      border: 1px solid rgba(95, 114, 99, 0.10);
      border-radius: 18px;
      padding: 12px;
    }

    .chart-empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px dashed rgba(95, 114, 99, 0.20);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.22);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .chart-note {
      font-size: 12px;
      color: var(--muted);
    }

    .mini-grid {
      display: grid;
      gap: 10px;
    }

    .mini-card {
      padding: 12px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.08);
      display: grid;
      gap: 8px;
    }

    .mini-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meter {
      height: 10px;
      border-radius: 999px;
      background: var(--chart-track);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(79, 154, 61, 0.78), rgba(31, 143, 58, 0.98));
    }

    .meter-fill.outdoor {
      background: linear-gradient(90deg, rgba(141, 207, 223, 0.82), rgba(45, 111, 124, 0.94));
    }

    .meter-fill.alert {
      background: linear-gradient(90deg, rgba(179, 122, 20, 0.88), rgba(178, 59, 59, 0.95));
    }

    .gauge-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gauge-card {
      padding: 14px;
      border-radius: 16px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.08);
      display: grid;
      gap: 10px;
    }

    .gauge-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .gauge-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .gauge-value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .gauge-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(56, 122, 64, 0.10);
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(141, 207, 223, 0.75), rgba(31, 143, 58, 0.95));
    }

    .micro-grid {
      display: grid;
      gap: 12px;
    }

    .micro-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.08);
    }

    .micro-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
    }

    .event-list {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 140px);
      overflow: auto;
    }

    .event {
      padding: 12px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid rgba(95, 114, 99, 0.10);
    }

    .event.alert-warning {
      border-color: rgba(179, 122, 20, 0.30);
      background: linear-gradient(135deg, rgba(255, 245, 225, 0.95), rgba(234, 247, 228, 0.96));
    }

    .event.alert-critical {
      border-color: rgba(178, 59, 59, 0.34);
      background: linear-gradient(135deg, rgba(255, 234, 234, 0.96), rgba(246, 236, 232, 0.96));
      box-shadow: 0 8px 18px rgba(178, 59, 59, 0.10);
    }

    .event.alert-normal {
      border-color: rgba(31, 143, 58, 0.22);
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
      }

      .left,
      .right,
      .sticky-summary {
        position: static;
      }

      .stats,
      .grid-two,
      .gauge-grid {
        grid-template-columns: 1fr;
      }
    }


  index.js: |
    const config = window.__IOT_CONFIG__ || {};
    const apiBase = config.apiBase || (window.location.origin + "/api");
    const simulatorBase = config.simulatorBase || (window.location.origin + "/simulator");

    const fleetEl = document.getElementById("fleet");
    const summaryEl = document.getElementById("summary");
    const eventsEl = document.getElementById("events");
    const brokerEl = document.getElementById("broker");
    const scenarioLabelEl = document.getElementById("scenario-label");
    const zoneLabelEl = document.getElementById("zone-label");
    const climateChartEl = document.getElementById("climate-chart");
    const climateMetaEl = document.getElementById("climate-meta");
    const outdoorCardEl = document.getElementById("outdoor-card");
    const wateringChartEl = document.getElementById("watering-chart");
    const wateringMetaEl = document.getElementById("watering-meta");
    const actuatorCardEl = document.getElementById("actuator-card");
    const derivedCardEl = document.getElementById("derived-card");
    const historySparkEl = document.getElementById("history-spark");

    let currentZoneId = null;
    let previousHistoryKey = "";

    function severityClass(severity) {
      if (severity === "critical") return "critical";
      if (severity === "warning") return "warning";
      return "normal";
    }

    function severityIcon(severity) {
      if (severity === "critical") return "&#128293;";
      if (severity === "warning") return "&#9888;&#65039;";
      return "&#127807;";
    }

    function fmt(value, digits = 1, suffix = "") {
      if (value === null || value === undefined || Number.isNaN(value)) return "--";
      return Number(value).toFixed(digits) + suffix;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function latestNumber(values) {
      for (let index = values.length - 1; index >= 0; index -= 1) {
        const value = values[index];
        if (typeof value === "number" && Number.isFinite(value)) return value;
      }
      return null;
    }

    function pickPrimaryZone(devices) {
      if (!devices.length) return null;
      const greenhouse = devices.find((device) => device.zoneId === "greenhouse-a" || device.deviceId === "greenhouse-a");
      return greenhouse || devices[0];
    }

    function normalizeHistory(points) {
      return points.map((point, index) => ({
        index,
        ts: point.ts || new Date().toISOString(),
        label: new Date(point.ts || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        temperature: point.temperature ?? null,
        humidity: point.humidity ?? null,
        co2: point.co2 ?? null,
        soilMoisture: point.soilMoisture ?? null,
        tankLevel: point.tankLevel ?? null,
        irrigationFlow: point.irrigationFlow ?? null,
      }));
    }

    function renderSummary(summary) {
      const cards = [
        ["&#127807; Zones", summary.zones ?? 0, ""],
        ["&#9989; Online", summary.online ?? 0, ""],
        ["&#128293; Critical", summary.critical ?? 0, ""],
        ["&#127777;&#65039; Avg Temp", summary.avgTemperature, " C"],
        ["&#127787;&#65039; Avg VPD", summary.avgVpd, " kPa"],
      ];

      summaryEl.innerHTML = cards.map(([label, value, suffix]) =>
        '<div class="stat">' +
          '<div class="muted">' + label + '</div>' +
          '<div class="value">' + (typeof value === "number" ? value.toFixed(1).replace(".0", "") + suffix : value) + '</div>' +
        '</div>'
      ).join("");
    }

    function renderFleet(devices) {
      fleetEl.innerHTML = devices.map((device) =>
        '<div class="event">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center">' +
            '<strong>' + (device.zoneId || device.deviceId) + '</strong>' +
            '<span class="pill ' + severityClass(device.severity) + '">' + severityIcon(device.severity) + ' ' + (device.severity || "normal") + '</span>' +
          '</div>' +
          '<div class="muted" style="margin-top:6px">Scenario: ' + (device.scenario || "unknown") + '</div>' +
          '<div class="muted" style="margin-top:4px">Last seen: ' + new Date(device.lastSeen || Date.now()).toLocaleTimeString() + '</div>' +
          '<div style="margin-top:10px;font-size:14px">' +
            '&#127777;&#65039; ' + fmt(device.indoor?.temperature ?? device.temperature, 1, ' C') +
            ' · &#128167; ' + fmt(device.indoor?.humidity ?? device.humidity, 1, ' %') +
          '</div>' +
        '</div>'
      ).join("");
    }

    function renderChartMeta(target, items) {
      target.innerHTML = items.map((item) =>
        '<div class="chart-pill">' +
          '<span class="swatch" style="background:' + item.color + '"></span>' +
          '<span>' + item.label + '</span>' +
          '<strong>' + item.value + '</strong>' +
        '</div>'
      ).join("");
    }

    function pathForSeries(values, width, height, padding, min, max) {
      const valid = values
        .map((value, index) => ({ value, index }))
        .filter((entry) => typeof entry.value === "number" && Number.isFinite(entry.value));
      if (!valid.length) return "";

      const range = Math.max(max - min, 0.0001);
      return valid.map((entry, position) => {
        const x = padding.left + (entry.index / Math.max(values.length - 1, 1)) * (width - padding.left - padding.right);
        const y = height - padding.bottom - ((entry.value - min) / range) * (height - padding.top - padding.bottom);
        return (position === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2);
      }).join(" ");
    }

    function buildLineChart(series, options = {}) {
      const width = options.width || 640;
      const height = options.height || 220;
      const padding = { top: 14, right: 10, bottom: 24, left: 10 };
      const samples = Math.max(...series.map((item) => item.values.length), 0);
      const allValues = series.flatMap((item) => item.values).filter((value) => typeof value === "number" && Number.isFinite(value));

      if (!samples || !allValues.length) {
        return '<div class="chart-empty">Waiting for enough telemetry to render a chart.</div>';
      }

      const min = Math.min(...allValues);
      const max = Math.max(...allValues);

      const gridLines = [0.2, 0.4, 0.6, 0.8].map((step) => {
        const y = height - padding.bottom - step * (height - padding.top - padding.bottom);
        return '<line x1="' + padding.left + '" y1="' + y.toFixed(2) + '" x2="' + (width - padding.right) + '" y2="' + y.toFixed(2) + '" stroke="var(--chart-grid)" stroke-width="1" />';
      }).join("");

      const tickIndexes = [0, Math.floor((samples - 1) / 2), samples - 1]
        .filter((value, index, values) => values.indexOf(value) === index && value >= 0);

      const ticks = tickIndexes.map((sourceIndex) => {
        const label = (options.labels || [])[sourceIndex] || "";
        const x = padding.left + (sourceIndex / Math.max(samples - 1, 1)) * (width - padding.left - padding.right);
        return '<text x="' + x.toFixed(2) + '" y="' + (height - 6) + '" text-anchor="middle" fill="var(--muted)" font-size="11">' + label + '</text>';
      }).join("");

      const lines = series.map((item) => {
        const d = pathForSeries(item.values, width, height, padding, min, max);
        if (!d) return "";
        return '<path d="' + d + '" fill="none" stroke="' + item.color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />';
      }).join("");

      return (
        '<div class="chart-card">' +
          '<div class="chart-legend">' +
            series.map((item) =>
              '<div class="legend-item"><span class="swatch" style="background:' + item.color + '"></span>' + item.label + '</div>'
            ).join("") +
          '</div>' +
          '<div class="chart-frame">' +
            '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + (options.title || "telemetry chart") + '">' +
              gridLines +
              lines +
              ticks +
            '</svg>' +
          '</div>' +
          '<div class="chart-note">' + (options.note || "Rolling telemetry history") + '</div>' +
        '</div>'
      );
    }

    function buildMicroChart(values, color) {
      const valid = values.filter((value) => typeof value === "number" && Number.isFinite(value));
      if (!valid.length) {
        return '<div class="chart-note">No history</div>';
      }

      const width = 300;
      const height = 60;
      const padding = { top: 6, right: 4, bottom: 6, left: 4 };
      const min = Math.min(...valid);
      const max = Math.max(...valid);
      const d = pathForSeries(values, width, height, padding, min, max);

      return (
        '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img">' +
          '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />' +
        '</svg>'
      );
    }

    function renderOutdoor(zone) {
      const items = [
        {
          label: "Outdoor Temp",
          value: fmt(zone.outdoor?.temperature, 1, " C"),
          pct: clamp(((Number(zone.outdoor?.temperature) || 0) + 10) / 45, 0, 1),
          tone: "outdoor",
        },
        {
          label: "Outdoor RH",
          value: fmt(zone.outdoor?.humidity, 1, " %"),
          pct: clamp((Number(zone.outdoor?.humidity) || 0) / 100, 0, 1),
          tone: "outdoor",
        },
        {
          label: "Solar",
          value: fmt(zone.outdoor?.solar, 3, ""),
          pct: clamp((Number(zone.outdoor?.solar) || 0) / 1.2, 0, 1),
          tone: "outdoor",
        },
        {
          label: "Wind",
          value: fmt(zone.outdoor?.wind, 2, " m/s"),
          pct: clamp((Number(zone.outdoor?.wind) || 0) / 10, 0, 1),
          tone: "outdoor",
        },
      ];

      outdoorCardEl.innerHTML = items.map((item) =>
        '<div class="mini-card">' +
          '<div class="mini-head"><span>' + item.label + '</span><span>' + item.value + '</span></div>' +
          '<div class="meter"><div class="meter-fill ' + item.tone + '" style="width:' + (item.pct * 100).toFixed(0) + '%"></div></div>' +
        '</div>'
      ).join("");
    }

    function renderActuators(zone) {
      const items = [
        ["Vent", zone.actuators?.vent],
        ["Heater", zone.actuators?.heater],
        ["Fan", zone.actuators?.fan],
        ["Mister", zone.actuators?.mister],
        ["Irrigation", zone.actuators?.irrigation],
        ["Grow Light", zone.actuators?.growLight],
      ];

      actuatorCardEl.innerHTML = items.map(([label, value]) => {
        const pct = clamp(Number(value) || 0, 0, 1);
        return (
          '<div class="mini-card">' +
            '<div class="mini-head"><span>' + label + '</span><span>' + fmt(value, 2, "") + '</span></div>' +
            '<div class="meter"><div class="meter-fill alert" style="width:' + (pct * 100).toFixed(0) + '%"></div></div>' +
          '</div>'
        );
      }).join("");
    }

    function renderDerived(zone) {
      const items = [
        {
          label: "Dew Point",
          display: fmt(zone.derived?.dewPoint ?? zone.indoor?.dewPoint, 2, " C"),
          pct: clamp(((Number(zone.derived?.dewPoint ?? zone.indoor?.dewPoint) || 0) + 10) / 35, 0, 1),
        },
        {
          label: "VPD",
          display: fmt(zone.derived?.vpd ?? zone.indoor?.vpd, 2, " kPa"),
          pct: clamp((Number(zone.derived?.vpd ?? zone.indoor?.vpd) || 0) / 3.5, 0, 1),
        },
        {
          label: "ET Proxy",
          display: fmt(zone.derived?.evapotranspiration, 2, ""),
          pct: clamp((Number(zone.derived?.evapotranspiration) || 0) / 5, 0, 1),
        },
        {
          label: "Irrigation Demand",
          display: fmt(zone.derived?.irrigationDemand, 1, " %"),
          pct: clamp((Number(zone.derived?.irrigationDemand) || 0) / 100, 0, 1),
        },
      ];

      derivedCardEl.innerHTML = items.map((item) =>
        '<div class="gauge-card">' +
          '<div class="gauge-top">' +
            '<div class="gauge-label">' + item.label + '</div>' +
            '<div class="gauge-value">' + item.display + '</div>' +
          '</div>' +
          '<div class="gauge-track"><div class="gauge-fill" style="width:' + (item.pct * 100).toFixed(0) + '%"></div></div>' +
        '</div>'
      ).join("");
    }

    function renderHistory(points) {
      const latest = points.slice(-16);
      const rows = [
        ["Temperature", latest.map((point) => point.temperature), "var(--climate-a)", fmt(latestNumber(latest.map((point) => point.temperature)), 1, " C")],
        ["Humidity", latest.map((point) => point.humidity), "var(--climate-b)", fmt(latestNumber(latest.map((point) => point.humidity)), 1, " %")],
        ["CO2", latest.map((point) => point.co2), "var(--climate-c)", fmt(latestNumber(latest.map((point) => point.co2)), 0, " ppm")],
        ["Soil Moisture", latest.map((point) => point.soilMoisture), "var(--water-a)", fmt(latestNumber(latest.map((point) => point.soilMoisture)), 3, "")],
        ["Tank Level", latest.map((point) => point.tankLevel), "var(--water-c)", fmt(latestNumber(latest.map((point) => point.tankLevel)), 1, " %")],
      ];

      historySparkEl.innerHTML = rows.map(([label, values, color, latestValue]) =>
        '<div class="micro-card">' +
          '<div class="micro-head"><strong>' + label + '</strong><span class="muted">' + latestValue + '</span></div>' +
          buildMicroChart(values, color) +
        '</div>'
      ).join("");
    }

    function renderHistoryCharts(points) {
      const history = normalizeHistory(points);
      const labels = history.map((point) => point.label);

      const climateSeries = [
        { label: "Air Temp", color: "var(--climate-a)", values: history.map((point) => point.temperature) },
        { label: "Humidity", color: "var(--climate-b)", values: history.map((point) => point.humidity) },
        { label: "CO2", color: "var(--climate-c)", values: history.map((point) => point.co2) },
      ];

      const wateringSeries = [
        { label: "Soil Moisture", color: "var(--water-a)", values: history.map((point) => point.soilMoisture) },
        { label: "Tank Level", color: "var(--water-b)", values: history.map((point) => point.tankLevel) },
        { label: "Irrigation Flow", color: "var(--water-c)", values: history.map((point) => point.irrigationFlow) },
      ];

      climateChartEl.innerHTML = buildLineChart(climateSeries, {
        labels,
        title: "Climate trends",
        note: "Temperature, humidity, and CO2 over the recent telemetry window.",
      });

      wateringChartEl.innerHTML = buildLineChart(wateringSeries, {
        labels,
        title: "Watering and root-zone trends",
        note: "Soil moisture, tank level, and irrigation flow over time.",
      });

      renderChartMeta(climateMetaEl, [
        { label: "Air Temp", color: "var(--climate-a)", value: fmt(latestNumber(climateSeries[0].values), 1, " C") },
        { label: "Humidity", color: "var(--climate-b)", value: fmt(latestNumber(climateSeries[1].values), 1, " %") },
        { label: "CO2", color: "var(--climate-c)", value: fmt(latestNumber(climateSeries[2].values), 0, " ppm") },
      ]);

      renderChartMeta(wateringMetaEl, [
        { label: "Soil Moisture", color: "var(--water-a)", value: fmt(latestNumber(wateringSeries[0].values), 3, "") },
        { label: "Tank Level", color: "var(--water-b)", value: fmt(latestNumber(wateringSeries[1].values), 1, " %") },
        { label: "Irrig. Flow", color: "var(--water-c)", value: fmt(latestNumber(wateringSeries[2].values), 2, " L/min") },
      ]);
    }

    function eventCardClass(payload) {
      return "event alert-" + severityClass(payload.severity);
    }

    function renderEvents(events) {
      eventsEl.innerHTML = events.slice(0, 30).map((event) => {
        const payload = event.payload || {};
        const label = payload.zoneId || payload.deviceId || "system";
        const msg = payload.message || payload.code || event.topic;

        return (
          '<div class="' + eventCardClass(payload) + '">' +
            '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center">' +
              '<strong>' + label + '</strong>' +
              '<span class="pill ' + severityClass(payload.severity) + '">' + severityIcon(payload.severity) + ' ' + event.type + '</span>' +
            '</div>' +
            '<div class="muted" style="margin-top:6px">' + new Date(event.receivedAt).toLocaleTimeString() + '</div>' +
            '<div style="margin-top:8px;font-size:14px;font-weight:600">' + msg + '</div>' +
          '</div>'
        );
      }).join("");
    }

    function renderZone(zone) {
      zoneLabelEl.textContent = zone.zoneId || zone.deviceId || "--";
      scenarioLabelEl.textContent = zone.scenario || "unknown";
      renderOutdoor(zone);
      renderActuators(zone);
      renderDerived(zone);
    }

    async function loadScenario() {
      const res = await fetch(simulatorBase + "/scenario");
      const data = await res.json();
      scenarioLabelEl.textContent = data.scenario || "unknown";
    }

    async function setScenario(name) {
      const res = await fetch(simulatorBase + "/scenario/" + name, {
        method: "POST",
      });

      if (!res.ok) {
        throw new Error("failed to change scenario");
      }

      await loadScenario();
      await load();
    }

    async function load() {
      try {
        const [health, devices, summary, alerts] = await Promise.all([
          fetch(apiBase + "/health").then((response) => response.json()),
          fetch(apiBase + "/devices").then((response) => response.json()),
          fetch(apiBase + "/summary").then((response) => response.json()),
          fetch(apiBase + "/alerts").then((response) => response.json()),
        ]);

        brokerEl.textContent = health.mqttConnected ? "Broker connected" : "Broker disconnected";
        brokerEl.className = "pill " + (health.mqttConnected ? "normal" : "critical");
        brokerEl.innerHTML = severityIcon(health.mqttConnected ? "normal" : "critical") + " " + brokerEl.textContent;

        renderSummary(summary);
        renderFleet(devices);
        renderEvents(alerts);

        const zone = pickPrimaryZone(devices);
        if (!zone) {
          climateChartEl.innerHTML = '<div class="chart-empty">No zones are publishing telemetry yet.</div>';
          wateringChartEl.innerHTML = '<div class="chart-empty">No zones are publishing telemetry yet.</div>';
          climateMetaEl.innerHTML = "";
          wateringMetaEl.innerHTML = "";
          outdoorCardEl.innerHTML = "";
          actuatorCardEl.innerHTML = "";
          derivedCardEl.innerHTML = "";
          historySparkEl.innerHTML = "";
          return;
        }

        currentZoneId = zone.deviceId;
        renderZone(zone);

        const history = await fetch(apiBase + "/history/" + currentZoneId).then((response) => response.json());
        const historyKey = JSON.stringify(
          history.map((point) => [point.ts, point.temperature, point.humidity, point.co2, point.soilMoisture, point.tankLevel, point.irrigationFlow])
        );

        if (historyKey !== previousHistoryKey) {
          renderHistoryCharts(history);
          renderHistory(normalizeHistory(history));
          previousHistoryKey = historyKey;
        }
      } catch (error) {
        console.error("failed to load dashboard", error);
      }
    }

    document.querySelectorAll("[data-scenario]").forEach((button) => {
      button.addEventListener("click", async () => {
        try {
          await setScenario(button.dataset.scenario);
        } catch (error) {
          console.error(error);
        }
      });
    });

    await loadScenario();
    await load();
    setInterval(load, 3000);


  server.js: |
    const port = Number(process.env.UI_PORT || 8080);

    Bun.serve({
      port,
      async fetch(request) {
        const url = new URL(request.url);
        const path = url.pathname === "/" ? "/index.html" : url.pathname;

        const file = Bun.file("/src" + path);

        if (!(await file.exists())) {
          return new Response("Not found", { status: 404 });
        }

        const headers = new Headers();

        if (path.endsWith(".html")) headers.set("content-type", "text/html; charset=utf-8");
        if (path.endsWith(".css")) headers.set("content-type", "text/css; charset=utf-8");
        if (path.endsWith(".js")) headers.set("content-type", "text/javascript; charset=utf-8");

        return new Response(file, { headers });
      },
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-ui
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-ui
  template:
    metadata:
      labels:
        app: iot-ui
    spec:
      containers:
        - name: ui
          image: oven/bun:1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - bun /src/server.js
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: UI_PORT
              value: "8080"
            - name: API_BASE
              value: http://iot-api:8080
          
          volumeMounts:
            - name: ui-code
              mountPath: /src
              readOnly: true
          
      volumes:
        - name: ui-code
          configMap:
            name: iot-ui-code
---
apiVersion: v1
kind: Service
metadata:
  name: iot-ui
  namespace: iot-playground
spec:
  selector:
    app: iot-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080









