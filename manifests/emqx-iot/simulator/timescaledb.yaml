apiVersion: v1
kind: Secret
metadata:
  name: iot-timescaledb-secret
  namespace: iot-playground
type: Opaque
stringData:
  username: iot_app
  password: password123
  database: iot_playground
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iot-timescaledb-data
  namespace: iot-playground
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iot-timescaledb
  namespace: iot-playground
spec:
  serviceName: iot-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: iot-timescaledb
  template:
    metadata:
      labels:
        app: iot-timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: iot-timescaledb-secret
                  key: database
          
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
      
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iot-timescaledb-data
        - name: init-sql
          configMap:
            name: iot-timescaledb-init
---
apiVersion: v1
kind: Service
metadata:
  name: iot-timescaledb
  namespace: iot-playground
spec:
  selector:
    app: iot-timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432