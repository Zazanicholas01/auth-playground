apiVersion: v1
kind: Secret
metadata:
  name: dbgate-connection
  namespace: iot-playground
type: Opaque
stringData:
  POSTGRES_USER: iot_app
  POSTGRES_PASSWORD: password123
  POSTGRES_DB: iot_playground
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbgate-data
  namespace: iot-playground
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbgate
  template:
    metadata:
      labels:
        app: dbgate
    spec:
      containers:
        - name: dbgate
          image: dbgate/dbgate:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: CONNECTIONS
              value: timescale
            - name: LABEL_timescale
              value: TimescaleDB
            - name: SERVER_timescale
              value: iot-timescaledb
            - name: PORT_timescale
              value: "5432"
            - name: USER_timescale
              valueFrom:
                secretKeyRef:
                  name: dbgate-connection
                  key: POSTGRES_USER
            - name: PASSWORD_timescale
              valueFrom:
                secretKeyRef:
                  name: dbgate-connection
                  key: POSTGRES_PASSWORD
            - name: DATABASE_timescale
              valueFrom:
                secretKeyRef:
                  name: dbgate-connection
                  key: POSTGRES_DB
            - name: ENGINE_timescale
              value: postgres@dbgate-plugin-postgres
          
          volumeMounts:
            - name: dbgate-data
              mountPath: /root/.dbgate
          
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          
      volumes:
        - name: dbgate-data
          persistentVolumeClaim:
            claimName: dbgate-data
---
apiVersion: v1
kind: Service
metadata:
  name: dbgate
  namespace: iot-playground
spec:
  selector:
    app: dbgate
  ports:
    - name: http
      port: 3000
      targetPort: 3000