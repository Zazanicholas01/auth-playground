apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: iot-playground
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: iot-playground
        orgId: 1
        folder: IoT Playground
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
