apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: iot-playground
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.iot-playground.svc.cluster.local:8428
        isDefault: true