apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: iot-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.111.0
          args:
            - "--storageDataPath=/storage"
            - "--httpListenAddr=:8428"
            - "--promscrape.config=/etc/vm/promscrape.yaml"
            - "--retentionPeriod=1"
          ports:
            - containerPort: 8428
              name: http
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /etc/vm
      
      volumes:
        - name: storage
          emptyDir: {}
        - name: config
          configMap:
            name: victoriametrics-scrape-config
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: iot-playground
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428