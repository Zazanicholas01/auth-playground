apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: iot-playground
data:
  iot-observability.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "expr": "iot_api_mqtt_connected",
              "refId": "A"
            }
          ],
          "title": "API MQTT Connected",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "rate(iot_api_mqtt_messages_total[5m])",
              "legendFormat": "{{event_type}}",
              "refId": "A"
            }
          ],
          "title": "API MQTT Messages/sec",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "iot_simulator_mqtt_connected",
              "refId": "A"
            }
          ],
          "title": "Simulator MQTT Connected",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "expr": "rate(iot_simulator_publish_success_total[5m])",
              "refId": "A"
            }
          ],
          "title": "Simulator Publishes/sec",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["iot", "victoriametrics"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "IoT Observability",
      "uid": "iot-observability",
      "version": 1
    }
